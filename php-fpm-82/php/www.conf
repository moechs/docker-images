[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 50
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000

request_terminate_timeout = 300s
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
