[PHP]
date.timezone = Asia/Shanghai
variables_order = "EGPCS"
expose_php = Off
cgi.fix_pathinfo = 0
display_errors = Off
error_log = /proc/self/fd/2
log_errors_max_len = 8192
memory_limit = 128M
max_execution_time = 180
max_input_time = 180
max_input_vars = 5000
post_max_size = 256M
upload_max_filesize = 128M
session.gc_maxlifetime = 7200
realpath_cache_ttl = 600
