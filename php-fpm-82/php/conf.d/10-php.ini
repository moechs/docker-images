[PHP]
date.timezone = Asia/Shanghai
expose_php = Off
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 50
allow_url_fopen = On
short_open_tag = Off
default_charset = "UTF-8"
cgi.fix_pathinfo = 0
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.gc_maxlifetime = 7200
realpath_cache_size = 4096K
realpath_cache_ttl = 600
