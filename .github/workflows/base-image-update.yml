name: base-image-update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: check and apply patch updates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and apply base image updates
        run: |
          python3 scripts/update_base_images.py --policy patch --apply --json > updates.json
          cat updates.json >> "$GITHUB_STEP_SUMMARY"
          echo "Updated projects:"
          jq -r '.updates[].project' updates.json | sort -u

      - name: Validate changes
        run: |
          git diff --check

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq '.updates | length' updates.json)" -eq 0 ]; then
            echo "No base image updates available."
            exit 0
          fi

          branch="chore/base-image-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          jq -r '.updates
            | group_by(.project)[]
            | .[0].project as $project
            | [ $project,
                (map("bump \(.current | split(":")[0]) from \(.current | split(":")[1]) to \(.new | split(":")[1])") | join("; "))
              ]
            | @tsv' updates.json |
          while IFS=$'\t' read -r project bumps; do
            git add "$project/Dockerfile"
            if git diff --cached --quiet; then
              continue
            fi
            git commit -m "chore(deps): ${bumps} in ${project}"
          done

          git push --force origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR for $branch already exists; branch has been refreshed."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch" \
              --title "chore(deps): automated patch updates for base images" \
              --body "Daily check found patch-level updates for upstream base images. Each project was committed separately with a conventional commit message. Dockerfiles were updated automatically by \`scripts/update_base_images.py --policy patch\`. Please review package version compatibility before merging."
          fi
