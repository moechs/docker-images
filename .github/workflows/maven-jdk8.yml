name: maven-jdk8

on:
  push:
    branches:
      - main
    paths:
      - maven-jdk8/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
    with:
      context: maven-jdk8
